name: Deploy Git Practice Lab

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Проверка и подготовка сайта
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v6

      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Сохранить сайт для публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    name: Опубликовать сайт
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4